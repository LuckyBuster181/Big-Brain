# Automatische Tests (10.10.2026, Claude Code).
# Laeuft bei jedem Push und jedem Pull Request. Rot = nicht zu Sir.
# Gleiche Python-Version wie Sirs PC (run_log.txt: Python 3.14), deutsche Zeitzone wie dort.
# Keine Schluessel, keine .env, kein Vault: die Tests brauchen nichts davon (test_000_isolierung).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      TZ: Europe/Berlin
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: PDF-Werkzeuge (fuer die Umwandeln-Tests; ohne sie werden 2 Tests uebersprungen)
        continue-on-error: true
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Echte Daten unberuehrt?
        # Tests duerfen nie in den echten data-Ordner schreiben (Schutz in tests/test_000_isolierung.py)
        run: |
          if [ -d ../data ]; then
            echo "FEHLER: Tests haben in data/ geschrieben:"; find ../data -type f; exit 1
          fi
