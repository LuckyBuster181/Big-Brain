<section class="page active" id="page-markt">
    <div class="seiten-kopf">
      <div><h1>Markt</h1><div class="unter" id="mkUnter">Live-Kurse · Krypto, Metalle, Devisen</div></div>
      <div class="mk-werkzeuge">
        <div class="seg" id="mkModus" title="Übersicht: alle Märkte als Kacheln. Trading: Liste, großer Chart, Details. Taste T wechselt.">
          <button data-mk="kacheln" class="active">Übersicht</button><button data-mk="trading">Trading</button>
        </div>
        <div class="seg"><span class="chip active" id="ansichtLive" title="Live-Kurse aus offenen Quellen">Live</span><span class="chip" id="ansichtAlle" title="Gold/Silber, Forex, Indizes, Aktien, Krypto - mit Kerzen, Prüfung und Bot-Zustand">Alle Märkte</span></div>
        <input type="search" id="search" placeholder="Suchen, z. B. BTC oder Gold" />
      </div>
    </div>
    <div class="mk-leiste">
      <span class="hint">Veränderung über</span><div class="chips" id="periods"></div>
      <div class="spacer"></div>
      <div id="alleLadenBox" class="row" style="gap:6px"><span class="chip" id="alleLaden" title="Alle Märkte im Hintergrund laden (Tages- und Stundenkerzen, gedrosselt, ca. 1-2 Minuten, keine Claude-Kosten)">Alle Märkte laden</span><span class="hint" id="alleStatus"></span></div>
    </div>

    <div id="mkKacheln" class="mk-kacheln"></div>

    <div class="mk-trading" id="mkTrading" hidden>
      <div class="card mk-liste">
        <h2>Märkte</h2>
        <div id="alleBox" style="display:none"><div class="tiles scroll" id="alleTiles"></div></div>
        <div class="tiles scroll" id="tiles"></div>
        <div class="err" id="marketErr"></div>
      </div>
      <div class="card mk-chart">
        <div class="row" style="justify-content: space-between;">
          <h2 style="margin:0;" id="chartTitle">Chart</h2>
          <div class="chips" id="intervals"></div>
        </div>
        <div id="chart"></div>
        <div class="row" id="chartInfo" style="margin-top:8px;"></div>
        <div class="err" id="chartErr"></div>
      </div>
      <div class="card mk-details">
        <h2>Details</h2>
        <div id="mkDetail"></div>
        <div id="zustandBox" style="display:none; margin-top:10px">
          <div class="hint" id="zustandQual"></div>
          <div class="row" style="gap:6px; margin:10px 0">
            <span class="chip" id="zustandFragen" title="Stellt Jarvis eine Frage zu diesem Markt - Vault zuerst, Kosten wie eine normale Frage">Jarvis erklärt</span>
            <span class="chip" id="zustandPaper" title="Paper-Order mit diesem Markt vorbereiten">Paper-Trade</span>
            <span class="chip" id="zustandBacktest" title="Diese Kerzen in der Trading-Sandbox durchrechnen">Backtest</span>
          </div>
          <div class="zustand-gitter" id="zustandKpis"></div>
          <ul class="erklaer-liste" id="zustandText"></ul>
        </div>
      </div>
    </div>
  </section>
