  Three.js r147. Bibliothek zuerst lokal aus lib/three/ (THREE_HOLEN.bat), sonst aus dem Internet (jsdelivr).
  Es wird nichts gespeichert und nichts gesendet. Eigene Gestaltung, keine Inhalte aus Spielen.

  TESTPLAN (Sir):
   1. Datei per Doppelklick öffnen (Chrome oder Edge). Nach einigen Sekunden: große Insel mit Steilküsten
      im Norden und Westen, Stränden im Süden, Hügeln, Felsen, Hochplateau in der Mitte mit dem goldenen Weltenbaum.
   2. "Licht": Morgen, Tag, Sonnenuntergang, Nacht. Nachts leuchtet die Baumkrone.
   3. Klick auf den Baum, einen der 6 Türme, eine Markierung oder ein Namensschild öffnet das Detailfeld.
   4. "Rundgang" fliegt alle 13 Orte an. Ziehen dreht, Rechtsklick verschiebt, Mausrad zoomt.
  PHASE 1 = PLATZHALTER: Türme und Regionen sind einfache Säulen. Echte Bauten folgen in Phase 2 und 3.
  EHRLICH UNGETESTET: Bildrate auf dem Haupt-PC und auf Handys; Beispieldaten von Hand, nicht live.
-->

<script>
"use strict";

/* =====================================================================================
   0. BIBLIOTHEK LADEN (lokal zuerst, sonst Internet)
   ===================================================================================== */
const THREE_VERSION = "0.147.0";
const BIBLIOTHEK = [
  "build/three.min.js",
  "examples/js/controls/OrbitControls.js",
  "examples/js/objects/Water.js",
  "examples/js/objects/Sky.js",
  "examples/js/shaders/CopyShader.js",

  "examples/js/postprocessing/RenderPass.js",
  "examples/js/postprocessing/ShaderPass.js",
  "examples/js/postprocessing/UnrealBloomPass.js"
];
function skriptLaden(src) {
  return new Promise((ok, fehler) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => { s.remove(); fehler(new Error(src)); };
    document.head.appendChild(s);
  });
}
async function bibliothekLaden() {
  let quelle = "lokal";
  const lokalZuerst = location.protocol !== "https:";
  for (const p of BIBLIOTHEK) {
    try { if (!lokalZuerst) throw new Error("online"); await skriptLaden("lib/three/" + p); }
    catch (e) { quelle = "Internet"; await skriptLaden(`https://cdn.jsdelivr.net/npm/three@${THREE_VERSION}/` + p); }
  }
  return quelle;
}


/* =====================================================================================

async function datenLaden() { return DATEN_BEISPIEL; }

const STATUS = {
  laeuft: { text:"läuft",  farbe:[61,220,132] },
  wartet: { text:"wartet", farbe:[255,196,61] },
  fehler: { text:"Fehler", farbe:[255,82,82] },

const REIHENFOLGE = ["testpc","hauptpc","minipc","nachtarbeit","aufgabenloop","vault",
                     "briefing","kalender","kosten","trading","sicherheit","tiktok"];
const AGENT_FARBE = { testpc:0x4e74aa, hauptpc:0x5c82be, minipc:0x42628e, nachtarbeit:0x6c56a6, aufgabenloop:0x3a9280,
  vault:0xb07c48, briefing:0x4692b8, kalender:0x709e4a, kosten:0xa04c60, trading:0xb67238, sicherheit:0x96964c, tiktok:0x8a4aa0 };

/* =====================================================================================
   2. HILFEN
   ===================================================================================== */
function zufallsquelle(start) {
  let a = start >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const zufall = zufallsquelle(20261004);
const mix = (a, b, t) => a + (b - a) * t;
const klemme = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rgbText = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const glatt = (a, b, v) => { const t = klemme((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const params = new URLSearchParams(location.search);
const GRAD = Math.PI / 180;

/* =====================================================================================
   2b. GELÄNDE-FORMEL (1 Einheit = 1 Meter; Norden = -z, Osten = +x)
   Gleiche Grundform wie die Kartenskizze im Vault (1 Kartenpixel = 10 m).
   ===================================================================================== */
function rauschen(seed) {
  const hash = (i, j) => {
    let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(seed, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
  };
}
const N1 = rauschen(11), N2 = rauschen(23), N3 = rauschen(37);
function fbm(n, x, y, okt) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < okt; i++) { s += a * n(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
function grat(n, x, y, okt) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < okt; i++) { s += a * (1 - Math.abs(n(x * f, y * f))); f *= 2.1; a *= 0.5; } return s; }
function stufen(h, s) { const f = h / s, i = Math.floor(f); return (i + glatt(0.3, 0.7, f - i)) * s; }

const SX = 1.22, RB = 3000;                 // Hauptinsel: Grundradius 3 km, in Ost-West-Richtung gestreckt
const HP = 260;                             // Höhe des Hochplateaus
function beule(t, mitte, breite, hoehe) { const d = Math.atan2(Math.sin(t - mitte), Math.cos(t - mitte)); return hoehe * Math.exp(-(d / breite) * (d / breite)); }
function rHaupt(t) {
  let r = RB * (1 + 0.09 * Math.sin(2 * t + 0.6) + 0.06 * Math.sin(3 * t + 2.1) + 0.05 * Math.sin(5 * t + 0.3) + 0.025 * Math.sin(9 * t + 1.7));
  r *= 1 + beule(t, 38 * GRAD, 0.16, 0.30);    // Neon-Kap (Nordost)
  r *= 1 + beule(t, -90 * GRAD, 0.10, -0.13);  // Hafenbucht (Süd)
  r *= 1 + beule(t, 185 * GRAD, 0.22, 0.14);   // Westhalbinsel
  r *= 1 + beule(t, -20 * GRAD, 0.08, -0.08);  // kleine Bucht Südost
  r *= 1 + beule(t, 118 * GRAD, 0.07, -0.07);  // Fjord Nord
  return r;
}
const KLIPPEN = [[70, 215], [-8, 22]];
const BERGE = [{ x: -2000, z: -2050, rx: 1500, rz: 950, h: 560 }, { x: 1600, z: -2250, rx: 1000, rz: 750, h: 430 }, { x: 3600, z: -800, rx: 700, rz: 600, h: 260 }, { x: -3300, z: 1500, rx: 650, rz: 520, h: 200 }];
function klippenAnteil(t) {
  const d = t / GRAD; let k = 0;
  for (const [a, b] of KLIPPEN) {
    const m = (a + b) / 2, h = (b - a) / 2, x = ((d - m + 540) % 360) - 180;
    k = Math.max(k, klemme((h - Math.abs(x)) / 12 + 0.5, 0, 1));
  }
  return k;
}
function weltPunkt(t, rho) { return { x: rho * Math.cos(t) * SX, z: -rho * Math.sin(t) }; }
function plateauRadius(a) { return 1280 * (1 + 0.05 * Math.sin(5 * a + 0.7) + 0.03 * Math.sin(8 * a + 2)); }

const GEHIRN = (function () { const t = 142 * GRAD, p = weltPunkt(t, rHaupt(t) + 2150); return { x: p.x, z: p.z, r: 920 }; })();
const TRADING = (function () { const t = -33 * GRAD, p = weltPunkt(t, rHaupt(t) + 3000); return { x: p.x, z: p.z, r: 360 }; })();
const INSELCHEN = [[100, 1200, 140], [205, 950, 180], [-120, 900, 110], [60, 600, 90], [250, 1400, 120]].map(([w, d, r]) => {
  const t = w * GRAD, p = weltPunkt(t, rHaupt(t) + d); return { x: p.x, z: p.z, r };
});

function hoeheHaupt(x, z) {
  const xs = x / SX, t = Math.atan2(-z, xs);
  const rho = Math.hypot(xs, z) + 150 * fbm(N2, x / 1100, z / 1100, 5);
  const dc = rHaupt(t) - rho;                                       // Abstand zur Küste (innen positiv)
  const k = klippenAnteil(t) * klemme(0.55 + fbm(N3, x / 650, z / 650, 2) * 1.3, 0, 1);
  if (dc < 0) return Math.max(-70, -2 + dc * (0.04 + 0.3 * k));
  let h = 3 * glatt(0, 90, dc) + 0.04 * Math.max(0, dc - 90);
  h += 85 * glatt(220, 1000, dc) * (0.4 + 0.6 * fbm(N1, x / 1500, z / 1500, 5));
  h += k * (75 + 55 * fbm(N1, x / 380, z / 380, 3)) * glatt(0, 40, dc);
  // Bergketten im Norden (zwischen Plateau und Steilküste)
  for (const B of BERGE) {
    const m = glatt(1, 0.25, Math.hypot((x - B.x) / B.rx, (z - B.z) / B.rz)) * glatt(60, 260, dc);
    if (m > 0) h += m * B.h * Math.pow(grat(N1, x / 760 + B.x, z / 760, 5), 1.3);
  }
  const fels = glatt(0.6, 0.78, grat(N3, x / 900, z / 900, 3)) * glatt(20, 60, h);
  h = mix(h, stufen(h, 16), 0.65 * fels);
  // Hochplateau mit steilem, gestuftem Rand
  const dp = Math.hypot(x, z), a = Math.atan2(-z, x), RP = plateauRadius(a) + 30 * fbm(N3, x / 300, z / 300, 2);
  if (dp < RP + 320) {
    const s = glatt(RP, RP + 300, dp);
    const rand = mix(HP, h, Math.pow(s, 0.7));
    h = dp < RP ? HP + 2.5 * fbm(N1, x / 160, z / 160, 2) * glatt(RP - 160, RP, dp) : mix(stufen(rand, 28), rand, glatt(0.75, 1, s));
  }
  return h;
}
function hoeheNebeninsel(x, z, I, sx, form) {
  const dx = (x - I.x) / sx, dz = z - I.z, t = Math.atan2(-dz, dx);
  const R = I.r * (form === "gehirn" ? (1 + 0.12 * Math.sin(3 * t + 1) + 0.06 * Math.sin(5 * t)) : form === "trading" ? (1 + 0.2 * Math.sin(4 * t + 0.4)) : (1 + 0.25 * Math.sin(3 * t + I.r)));
  const dc = R - (Math.hypot(dx, dz) + I.r * 0.1 * fbm(N2, x / 600, z / 600, 4));
  if (form === "gehirn") {
    if (dc < 0) return -2 + dc * 0.07;
    let h = 3 * glatt(0, 60, dc) + 0.05 * Math.max(0, dc - 60) + 26 * glatt(0, 28, dc) * klemme(fbm(N3, x / 500, z / 500, 2) + 0.35, 0, 1);
    // zwei runde Hügel mit einer Senke dazwischen (wie zwei Gehirnhälften)
    const lx = (x - I.x) / 1.15, lz = z - I.z;
    for (const s of [-1, 1]) {
      const d = Math.hypot((lx - s * 290) / 270, (lz + 40) / 420);
      h += 120 * Math.pow(glatt(1, 0, d), 1.4) * (1 + 0.15 * fbm(N1, x / 120, z / 120, 3));
    }
    return h;
  }

const NEBEL_FAKTOR = 0.3;   // die Welt ist ca. 3x so groß wie die Stadt
function lichtFuer(st) {
  let i = 0;
  while (i < LICHT.length - 2 && LICHT[i + 1].h <= st) i++;
  const a = LICHT[i], b = LICHT[i + 1], t = klemme((st - a.h) / (b.h - a.h), 0, 1), e = { stunde: st };
  for (const k in a) if (k !== "h") e[k] = Array.isArray(a[k]) ? a[k].map((v, j) => mix(v, b[k][j], t)) : mix(a[k], b[k], t);
  e.azimut = 90 + klemme((st - 6) / 13.5, 0, 1) * 180;
  return e;
}
const lichtWahl = document.getElementById("licht");
function stundeJetzt() {
  if (lichtWahl.value !== "auto") return parseFloat(lichtWahl.value);
  const d = new Date(); return d.getHours() + d.getMinutes() / 60;
}
let licht = lichtFuer(12), lichtSchluessel = "", infoLicht = "";
const farbe = (c, f) => new T.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear().multiplyScalar(f || 1);
const sonnenRichtung = new T.Vector3();
function lichtAktualisieren(erzwingen) {

  sonnenRichtung.setFromSphericalCoords(1, phi, theta);

    u.turbidity.value = licht.trueb; u.rayleigh.value = licht.rayleigh; u.mieCoefficient.value = 0.005; u.mieDirectionalG.value = 0.8;

    wasser.material.uniforms.waterColor.value.copy(farbe(licht.wasser));
  } else wasser.material.color.copy(farbe(licht.wasser, 1.3));
  renderer.toneMappingExposure = licht.bel;
  if (ende) ende.uniforms.belichtung.value = licht.bel;
  if (bloom) { bloom.strength = licht.bloomS; bloom.threshold = licht.bloomT; }
  sterne.material.opacity = klemme(-licht.hoehe / 10, 0, 1) * 0.9;
  mond.material.opacity = licht.mond;
  const n = licht.nacht;

let komposition = null, bloom = null, ende = null;
if (Q.hoch && T.EffectComposer && T.UnrealBloomPass) {
  const ziel = new T.WebGLRenderTarget(1, 1, { type: T.HalfFloatType, samples: 4 });
  komposition = new T.EffectComposer(renderer, ziel);
  komposition.addPass(new T.RenderPass(szene, kamera));
  bloom = new T.UnrealBloomPass(new T.Vector2(512, 512), 0.4, 0.55, 1.0);
  komposition.addPass(bloom);
  ende = new T.ShaderPass({
    uniforms: { tDiffuse: { value: null }, belichtung: { value: 0.5 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: `uniform sampler2D tDiffuse; uniform float belichtung; varying vec2 vUv;
      vec3 jarvisFit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
      vec3 jarvisAces(vec3 c){
        const mat3 ein = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
        const mat3 aus = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
        c *= belichtung / 0.6; c = ein * c; c = jarvisFit(c); c = aus * c; return clamp(c, 0.0, 1.0); }
      vec3 srgb(vec3 c){ return mix(pow(c, vec3(0.41666)) * 1.055 - vec3(0.055), c * 12.92, vec3(lessThanEqual(c, vec3(0.0031308)))); }
      void main(){ vec4 t = texture2D(tDiffuse, vUv); gl_FragColor = vec4(srgb(jarvisAces(t.rgb)), 1.0); }`
  });
  ende.material.toneMapped = false;   // eigene Tonwertkurve, Three soll keine zweite anhängen
  komposition.addPass(ende);
  renderer.toneMapping = T.NoToneMapping;  // Tonwertkurve nur einmal (im letzten Durchgang), sonst wird das Bild doppelt abgedunkelt
}
function groesse() {

}

const wenigBewegung = matchMedia("(prefers-reduced-motion: reduce)").matches;
let zeit = 0, daten = null, markiert = null;
const statusSchluessel = id => { const g = daten.gebaeude.find(x => x.id === id); return g ? g.status : "aus"; };
function bewegen(dt) {
  zeit += dt;
  if (wasser.material.uniforms) wasser.material.uniforms.time.value += dt * 0.6;
  else wasser.material.normalMap.offset.set(zeit * 0.004, zeit * 0.003);
  flachwasser.material.opacity = 0.85 + 0.15 * Math.sin(zeit * 0.9);
  funken.rotation.y = zeit * 0.02;
  funken.position.y = Math.sin(zeit * 0.4) * 12;
  for (const id in statusMats) {
    const sk = statusSchluessel(id), st = STATUS[sk] || STATUS.aus, s = statusMats[id];
    const puls = sk === "laeuft" ? 0.75 + 0.25 * Math.sin(zeit * 3) : sk === "fehler" ? (Math.sin(zeit * 9) > 0 ? 1 : 0.15) : sk === "wartet" ? 0.6 + 0.2 * Math.sin(zeit * 1.2) : 0.25;
    s.kugel.color.copy(farbe(st.farbe, 1.5 + 2 * puls));
    s.glanz.material.color.copy(farbe(st.farbe, puls));
    s.glanz.scale.setScalar(s.gross * 6 * (0.8 + 0.3 * puls));
  }
}
/** Schattenbereich folgt dem Blickpunkt: nah = scharf, weit weg = großer Bereich. */
let schattenHalb = 0;
function schattenNachfuehren() {
  const d = kamera.position.distanceTo(steuerung.target), h = klemme(d * 0.6, 500, 7000);
  const c = sonne.shadow.camera;
  if (Math.abs(h - schattenHalb) > schattenHalb * 0.12) { schattenHalb = h; c.left = -h; c.right = h; c.top = h; c.bottom = -h; c.updateProjectionMatrix(); }
  sonne.target.position.set(steuerung.target.x, 0, steuerung.target.z);
  sonne.position.copy(sonne.target.position).addScaledVector(sonnenRichtung, 12000);
}
/** Kamera nie unter den Boden; Nahgrenze passend zur Entfernung (gegen Flimmern auf große Distanz). */
function kameraPruefen() {
  const boden = Math.max(0, bodenHoehe(kamera.position.x, kamera.position.z)) + 25;
  if (kamera.position.y < boden) kamera.position.y = boden;
  const d = kamera.position.distanceTo(steuerung.target), near = klemme(d * 0.004, 2, 40);
  if (Math.abs(near - kamera.near) > kamera.near * 0.2) { kamera.near = near; kamera.updateProjectionMatrix(); }
}

const proj = new T.Vector3();
function schilderSetzen() {
  const b = leinwand.clientWidth, h = leinwand.clientHeight, rechtecke = [];
  const ids = Object.keys(schilder).sort((a, c) => (a === markiert ? -1 : c === markiert ? 1 : a === "jarvis" ? -1 : c === "jarvis" ? 1 : 0));
  for (const id of ids) {
    const g = ortGruppen[id], d = schilder[id];
    proj.set(g.position.x, g.position.y + g.userData.oben + 20, g.position.z).project(kamera);
    if (proj.z > 1) { d.style.display = "none"; continue; }
    d.style.display = "";
    const x = (proj.x * 0.5 + 0.5) * b, y = (-proj.y * 0.5 + 0.5) * h;
    d.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
    d.classList.toggle("aktiv", id === markiert);
    const breite = id === markiert ? 160 : (d.dataset.breite || (d.dataset.breite = d.querySelector(".text").textContent.length * 7 + 30));
    const r = { x: x - breite / 2, y: y - 22, w: +breite, h: 22 };
    const voll = !rechtecke.some(o => r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y);
    d.classList.toggle("klein", !voll && id !== markiert);
    if (voll || id === markiert) rechtecke.push(r);
  }
}
const strahl = new T.Raycaster(), maus = new T.Vector2();
let druck = null;
function trefferBei(e) {
  const r = leinwand.getBoundingClientRect();
  maus.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  strahl.setFromCamera(maus, kamera);
  const t = strahl.intersectObjects(Object.values(ortGruppen), true).find(x => !x.object.isSprite && !x.object.isPoints);
  if (!t) return null;
  let o = t.object; while (o && !o.userData.id) o = o.parent;
  return o ? o.userData.id : null;
}
leinwand.addEventListener("pointerdown", e => { druck = { x: e.clientX, y: e.clientY }; });
leinwand.addEventListener("pointerup", e => {
  if (!druck || Math.hypot(e.clientX - druck.x, e.clientY - druck.y) > 6) return;
  const id = trefferBei(e);
  if (id) { oeffneDetail(id); return; }
  schliesseDetail();
});
leinwand.addEventListener("pointermove", e => { if (e.buttons) return; leinwand.style.cursor = trefferBei(e) ? "pointer" : "grab"; });

let fahrtToken = 0;
function fahre(pos, ziel, ms) {
  const mein = ++fahrtToken, p0 = kamera.position.clone(), z0 = steuerung.target.clone();
  if (wenigBewegung || ms <= 0) { kamera.position.copy(pos); steuerung.target.copy(ziel); return Promise.resolve(); }
  // Bogen nach oben, damit lange Flüge nicht durch Berge gehen
  const hub = Math.min(2500, p0.distanceTo(pos) * 0.25);
  return new Promise(fertig => {
    const start = performance.now();
    (function schritt(j) {
      if (mein !== fahrtToken) { fertig(); return; }
      const t = Math.min(1, (j - start) / ms), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      kamera.position.lerpVectors(p0, pos, e); kamera.position.y += Math.sin(Math.PI * e) * hub;
      steuerung.target.lerpVectors(z0, ziel, e);
      if (t < 1) requestAnimationFrame(schritt); else fertig();
    })(start);
  });
}
const UEBERSICHT = { pos: new T.Vector3(1200, 4600, 10400), ziel: new T.Vector3(600, 150, -200) };
function uebersichtPos() {
  const a = leinwand.clientWidth / leinwand.clientHeight, f = a < 1 ? 1.6 / Math.max(a, 0.45) * 0.62 : 1;
  return { pos: UEBERSICHT.pos.clone().multiplyScalar(f), ziel: UEBERSICHT.ziel.clone() };
}
function zielFuer(id) {
  const g = ortGruppen[id], o = g.userData.oben;
  if (id === "jarvis") return { pos: new T.Vector3(2600, HP + 900, 3000), ziel: new T.Vector3(0, HP + 650, 0) };
  const aussen = new T.Vector3(g.position.x, 0, g.position.z).normalize();
  const ziel = new T.Vector3(g.position.x, g.position.y + o * 0.45, g.position.z);
  const abstand = 420 + o * 1.2;
  const pos = ziel.clone().add(aussen.multiplyScalar(abstand)).add(new T.Vector3(0, 160 + o * 0.5, 0));
  pos.y = Math.max(pos.y, bodenHoehe(pos.x, pos.z) + 120);
  return { pos, ziel };
}
steuerung.addEventListener("start", () => { fahrtToken++; if (rundgangLaeuft) stopp(false); });

const detail = document.getElementById("detail"), untertitel = document.getElementById("untertitel");
const knopfRundgang = document.getElementById("knopfRundgang"), knopfStopp = document.getElementById("knopfStopp");
function oeffneDetail(id) {
  const g = daten.gebaeude.find(x => x.id === id); if (!g) return;
  const st = STATUS[g.status] || STATUS.aus;
  markiert = id;
  document.getElementById("detailName").textContent = g.name + " · " + ORTE[id].ort;
  const s = document.getElementById("detailStatus"); s.textContent = "";
  const p = document.createElement("span"); p.className = "punkt"; p.style.background = rgbText(st.farbe);
  s.appendChild(p); s.appendChild(document.createTextNode("Status: " + st.text));
  const dl = document.getElementById("detailZahlen"); dl.textContent = "";
  (g.kennzahlen || []).slice(0, 3).forEach(z => {
    const dt = document.createElement("dt"); dt.textContent = z[0];
    const dd = document.createElement("dd"); dd.textContent = z[1];
    dl.appendChild(dt); dl.appendChild(dd);
  });
  document.getElementById("detailText").textContent = g.text || "";
  detail.classList.add("an");
}
function schliesseDetail() { detail.classList.remove("an"); if (!rundgangLaeuft) markiert = null; }
let rundgangToken = 0, rundgangLaeuft = false;
const warte = ms => new Promise(f => setTimeout(f, ms));
async function rundgang() {
  if (rundgangLaeuft) return;
  rundgangLaeuft = true;
  const mein = ++rundgangToken;
  knopfRundgang.disabled = true; knopfStopp.disabled = false;
  schliesseDetail();
  for (const id of ["jarvis"].concat(REIHENFOLGE_RUNDGANG)) {
    if (mein !== rundgangToken) return;
    const g = daten.gebaeude.find(x => x.id === id); if (!g) continue;
    markiert = id;
    untertitel.textContent = g.name + " (" + ORTE[id].ort + ") – " + (STATUS[g.status] || STATUS.aus).text + ". " + (g.text || "");
    untertitel.classList.add("an");
    const z = zielFuer(id);
    await fahre(z.pos, z.ziel, 2200);
    if (mein !== rundgangToken) return;
    await warte(1800);
  }
  if (mein !== rundgangToken) return;
  untertitel.classList.remove("an"); markiert = null;
  const u = uebersichtPos(); await fahre(u.pos, u.ziel, 2200);
  if (mein === rundgangToken) { rundgangLaeuft = false; knopfRundgang.disabled = false; knopfStopp.disabled = true; }
}
// Reihenfolge im Uhrzeigersinn: erst die Türme, dann Regionen und Inseln
const REIHENFOLGE_RUNDGANG = ["hauptpc", "minipc", "kosten", "sicherheit", "testpc", "nachtarbeit", "vault", "aufgabenloop", "briefing", "trading", "kalender", "tiktok"];
function stopp(zurueck) {
  if (!rundgangLaeuft) return;
  rundgangToken++; rundgangLaeuft = false;
  untertitel.classList.remove("an"); markiert = null;
  knopfRundgang.disabled = false; knopfStopp.disabled = true;
  if (zurueck !== false) { const u = uebersichtPos(); fahre(u.pos, u.ziel, 1400); }
}
function zusammenfassungZeigen() {
  if (!daten) return;
  const zahl = { laeuft: 0, wartet: 0, fehler: 0, aus: 0 };
  daten.gebaeude.forEach(g => { if (zahl[g.status] !== undefined) zahl[g.status]++; });
  const z = document.getElementById("zusammenfassung"); z.textContent = "";
  Object.keys(STATUS).forEach(k => {
    const s = document.createElement("span"), p = document.createElement("span");
    p.className = "punkt"; p.style.background = rgbText(STATUS[k].farbe);
    s.appendChild(p); s.appendChild(document.createTextNode(zahl[k] + " " + STATUS[k].text)); z.appendChild(s);
  });
  const l = document.createElement("span"); l.textContent = infoLicht; z.appendChild(l);
  const ph = document.createElement("span"); ph.textContent = "Phase 1: Gelände (Türme und Orte sind Platzhalter)"; z.appendChild(ph);
  const h = document.createElement("span"); h.className = "hinweis"; h.textContent = daten.stand || ""; z.appendChild(h);
}
function tastaturListeBauen() {
  const liste = document.getElementById("tastaturListe"); liste.textContent = "";
  for (const id of ["jarvis"].concat(REIHENFOLGE_RUNDGANG)) {
    const g = daten.gebaeude.find(x => x.id === id); if (!g) continue;
    const b = document.createElement("button"); b.type = "button";
    b.textContent = g.name + " (" + ORTE[id].ort + "), Status " + (STATUS[g.status] || STATUS.aus).text;
    b.addEventListener("click", () => { oeffneDetail(id); const z = zielFuer(id); fahre(z.pos, z.ziel, 1100); });
    liste.appendChild(b);
  }
}
knopfRundgang.addEventListener("click", rundgang);
knopfStopp.addEventListener("click", () => stopp());
document.getElementById("knopfUebersicht").addEventListener("click", () => { stopp(false); schliesseDetail(); const u = uebersichtPos(); fahre(u.pos, u.ziel, 1600); });
document.getElementById("schliessen").addEventListener("click", schliesseDetail);
lichtWahl.addEventListener("change", () => lichtAktualisieren(true));
document.addEventListener("keydown", e => { if (e.key === "Escape") { stopp(); schliesseDetail(); } });
setInterval(() => lichtAktualisieren(false), 60000);

/* =====================================================================================
   11. LOS
   ===================================================================================== */
daten = startDaten;
schilderBauen();
tastaturListeBauen();
lichtAktualisieren(true);
{ const u = uebersichtPos(); kamera.position.copy(u.pos); steuerung.target.copy(u.ziel); steuerung.update(); }
document.getElementById("laden").style.display = "none";
window.__welt = { szene, renderer, kamera, steuerung, licht: () => licht, quelle, stufe, hoehe, bodenHoehe, ORTE, ortGruppen, zielFuer, oeffneDetail,
  gitter: gelaende.nx + " x " + gelaende.nz, ecken: gelaende.mesh.geometry.attributes.position.count, aufbauMs: Math.round(performance.now() - t0) };
let letzte = performance.now(), bilder = 0, bildZeit = 0;
renderer.setAnimationLoop(() => {
  const jetzt = performance.now(), dt = Math.min(0.1, (jetzt - letzte) / 1000); letzte = jetzt;
  if (document.hidden) return;
  if (!wenigBewegung) bewegen(dt); else if (zeit === 0) bewegen(0.016);
  steuerung.update();
  kameraPruefen();
  schattenNachfuehren();
  if (komposition) komposition.render(); else renderer.render(szene, kamera);
  schilderSetzen();
  bilder++; bildZeit += dt; if (bildZeit > 2) { window.__fps = bilder / bildZeit; bilder = 0; bildZeit = 0; }
});
}
