<title>Auron Insel-Stadt</title>
<!--
  Auron Insel-Stadt in 3D (04.10.2026, Entwurf 4: echter Maßstab, 1 Einheit = 1 Meter, Insel ca. 2,8 km). Three.js r147, sonst keine Abhängigkeiten.
  Bibliothek: zuerst lokal aus lib/three/ (THREE_HOLEN.bat legt sie dort ab), sonst aus dem Internet (jsdelivr).
  Es wird nichts gespeichert und nichts gesendet.

  TESTPLAN (Sir):
   1. Datei per Doppelklick öffnen (Chrome oder Edge). Nach kurzem Laden: große Insel (ca. 2,8 km) mit Strand, weißer
      Promenade, Wiesen, Parks, vielen weißen und gläsernen Zukunftsbauten, Einschienenbahn mit Zug, Riesenrad,
      Booten, Luftschiffen und in der Mitte dem sehr hohen goldenen Turm "Auron".
   2. "Licht": Morgen, Tag, Sonnenuntergang, Nacht. Himmel, Sonne, Wasser, Schatten, Fenster, Laternen ändern sich.
   3. Klick auf Auron, ein Arbeitsgebäude oder ein Namensschild öffnet das Detailfeld. Andere Häuser reagieren nicht.
   4. "Rundgang" fliegt alle 13 Gebäude an (je 3 s). "Stopp" bricht ab. Ziehen dreht, Rechtsklick/zwei Finger
      verschieben, Mausrad/zwei Finger zoomen.
  EHRLICH UNGETESTET / FEHLERQUELLEN:
   - Beispieldaten von Hand, nicht live (datenLaden() ist vorbereitet).
   - Handy: einfachere Grafik (keine Spiegelung, kein Leuchten), auf echten Handys ungetestet.
   - Ohne lib/three/ und ohne Internet startet die Seite nicht (Hinweis erscheint).
-->
<style>

<script>
"use strict";

/* =====================================================================================
   0. BIBLIOTHEK LADEN (lokal zuerst, sonst Internet)
   ===================================================================================== */
const THREE_VERSION = "0.147.0";
const BIBLIOTHEK = [
  "build/three.min.js",
  "examples/js/controls/OrbitControls.js",
  "examples/js/objects/Water.js",
  "examples/js/objects/Sky.js",
  "examples/js/shaders/CopyShader.js",
  "examples/js/shaders/LuminosityHighPassShader.js",
  "examples/js/postprocessing/EffectComposer.js",
  "examples/js/postprocessing/RenderPass.js",
  "examples/js/postprocessing/ShaderPass.js",
  "examples/js/postprocessing/UnrealBloomPass.js"
];
function skriptLaden(src) {
  return new Promise((ok, fehler) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => { s.remove(); fehler(new Error(src)); };
    document.head.appendChild(s);
  });
}
async function bibliothekLaden() {
  let quelle = "lokal";
  const lokalZuerst = location.protocol !== "https:";
  for (const p of BIBLIOTHEK) {
    try { if (!lokalZuerst) throw new Error("online"); await skriptLaden("lib/three/" + p); }
    catch (e) { quelle = "Internet"; await skriptLaden(`https://cdn.jsdelivr.net/npm/three@${THREE_VERSION}/` + p); }
  }
  return quelle;
}

/* =====================================================================================
   1. DATEN (BEISPIELDATEN, von Hand eingetragen, Stand 04.10.2026, NICHT live)
   ===================================================================================== */
const DATEN_BEISPIEL = {

    { id:"minipc", name:"Mini-PC", status:"laeuft",

      text:"Das Zuhause von Auron: Dienst, Nacht-Timer und Syncthing laufen hier." },
    { id:"nachtarbeit", name:"Nachtarbeit", status:"wartet",
      kennzahlen:[["Nächster Lauf","03:00 Uhr"],["Letzte Nacht","1 fertig, 2 Fehler"],["KI","nur lokal (neu)"]],
      text:"Arbeitet nachts Aufträge ab. Seit dem 04.10. ohne Claude-Anbindung, kostet nichts." },
    { id:"aufgabenloop", name:"Aufgaben-Loop", status:"wartet",
      kennzahlen:[["Offener Vorschlag","Wärmepumpe"],["Schreiber","lokal"],["Recherche","Claude (Websuche)"]],
      text:"Macht aus Wissenslücken Notiz-Entwürfe. Wartet auf Ihre Freigabe im HUD." },
    { id:"vault", name:"Vault", status:"laeuft",
      kennzahlen:[["Suchtest","26/28 auf Platz 1"],["Index","aktuell"],["Änderungen","werden überwacht"]],
      text:"Big Brain: Ihre Notizen in Obsidian, durchsucht von Auron." },
    { id:"briefing", name:"Briefing & Gmail", status:"laeuft",

      text:"Fasst Mails, Termine und Stand des Vortags zu einem Tagesbriefing zusammen." },
    { id:"kalender", name:"Kalender", status:"laeuft",
      kennzahlen:[["Termine heute","0"],["Quelle","Google Kalender (iCal)"],["Schreiben","über Termin-Links"]],
      text:"Zeigt Ihre Termine und Feiertage im HUD an." },
    { id:"kosten", name:"Kosten", status:"laeuft",
      kennzahlen:[["Heute","0,00 €"],["Monat (Schätzung)","ca. 0,30 $"],["Rahmen","30 $ im Monat"]],
      text:"Zählt, was die Claude-API kostet. Lokale KI kostet nichts." },
    { id:"trading", name:"Trading", status:"aus",
      kennzahlen:[["Modus","Demokonto"],["Laufende Bots","0"],["Kandidat","Divergenz Gold-Silber"]],
      text:"Trading-Labor. Aktuell nichts aktiv, der Umbau auf MQL5 steht aus." },
    { id:"sicherheit", name:"Sicherheit", status:"wartet",
      kennzahlen:[["Ampel","gelb"],["Rote Funde","0"],["Letzter Check","04.10."]],
      text:"Prüft nur lesend auf offene Zugangsdaten. Gelb heißt: aufräumen, aber nichts Akutes." },
    { id:"tiktok", name:"TikTok", status:"wartet",
      kennzahlen:[["Ausgewertet","178 Videos"],["Fehlgeschlagen","9"],["Nächster Schritt","Bild-Auswertung"]],
      text:"Wertet gespeicherte Videos aus und legt Notizen im Vault an." }
  ]
};
/** Holt die Daten. Später: const a = await fetch("/api/stadt"); return await a.json(); (gleiches Format). */
async function datenLaden() { return DATEN_BEISPIEL; }

const STATUS = {
  laeuft: { text:"läuft",  farbe:[61,220,132] },
  wartet: { text:"wartet", farbe:[255,196,61] },
  fehler: { text:"Fehler", farbe:[255,82,82] },
  aus:    { text:"aus",    farbe:[120,128,140] }
};
const REIHENFOLGE = ["testpc","hauptpc","minipc","nachtarbeit","aufgabenloop","vault",
                     "briefing","kalender","kosten","trading","sicherheit","tiktok"];
const AGENT_FARBE = { testpc:0x4e74aa, hauptpc:0x5c82be, minipc:0x42628e, nachtarbeit:0x6c56a6, aufgabenloop:0x3a9280,
  vault:0xb07c48, briefing:0x4692b8, kalender:0x709e4a, kosten:0xa04c60, trading:0xb67238, sicherheit:0x96964c, tiktok:0x8a4aa0 };

/* =====================================================================================
   2. HILFEN
   ===================================================================================== */
function zufallsquelle(start) {
  let a = start >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const zufall = zufallsquelle(20261004);
const mix = (a, b, t) => a + (b - a) * t;
const klemme = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rgbText = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const RI = 1400, BODEN = 6;                                // Inselradius und Bodenhöhe in Metern
function inselRand(w) { return RI * (1 + 0.07 * Math.sin(3 * w + 1) + 0.045 * Math.sin(5 * w + 2) + 0.025 * Math.sin(7 * w + 0.5)); }
const wDes = (x, z) => Math.atan2(z, x);
const params = new URLSearchParams(location.search);
/* Auron-Modus (04.10.2026): Die Seite läuft als Hintergrund der Tour in dashboard/auron.html.
   Nachrichten von dort: {auron:"fahre", id} (id eines Gebäudes oder "uebersicht"), {auron:"farbe", turm:0xRRGGBB}.
   Antworten: {auron:"bereit"}, {auron:"angekommen", id}, {auron:"fehler", text}. */
const AURON = params.get("auron") === "1" && window.parent !== window;
function anAuron(nachricht) { if (AURON) { try { window.parent.postMessage(nachricht, location.origin); } catch (e) {} } }
if (AURON) {
  document.body.classList.add("auron");
  const b = document.querySelector("#laden b"); if (b) b.textContent = "Auron";
}

/* =====================================================================================
   3. START
   ===================================================================================== */
const ladenText = document.getElementById("ladenText");
window.__fehler = [];
window.addEventListener("error", e => { window.__fehler.push(String(e.message)); ladenText.textContent = "Fehler: " + e.message; anAuron({ auron: "fehler", text: String(e.message) }); });
(async function () {
  let quelle;
  try { quelle = await bibliothekLaden(); }
  catch (e) {
    ladenText.innerHTML = "Die 3D-Bibliothek (Three.js) fehlt.<br>Bitte <b>werkstatt\\THREE_HOLEN.bat</b> einmal starten oder mit dem Internet verbinden.";
    console.error("Bibliothek fehlt:", e);
    anAuron({ auron: "fehler", text: "3D-Bibliothek fehlt" });
    return;
  }
  try {
    const daten = await datenLaden().catch(() => DATEN_BEISPIEL);
    stadtStarten(daten, quelle);
  } catch (e) {
    ladenText.textContent = "Fehler beim Aufbau: " + e.message;
    console.error(e);
    anAuron({ auron: "fehler", text: "Aufbau: " + e.message });
  }
})();

function stadtStarten(startDaten, quelle) {
const T = THREE;
if (T.ColorManagement) T.ColorManagement.legacyMode = false;   // Farben korrekt (sRGB -> linear)
const mobil = matchMedia("(pointer: coarse)").matches || innerWidth < 700;
const stufe = params.get("q") || (mobil ? "niedrig" : "hoch");
const Q = { hoch: stufe === "hoch", schatten: stufe === "hoch" ? 4096 : 1024, dpr: Math.min(devicePixelRatio || 1, stufe === "hoch" ? 2 : 1.5) };

/* ---------- Renderer, Szene, Kamera ---------- */
const leinwand = document.getElementById("stadt");
const renderer = new T.WebGLRenderer({ canvas: leinwand, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Q.dpr);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
const szene = new T.Scene();
szene.fog = new T.FogExp2(0xbcd4e6, 0.00009);
const kamera = new T.PerspectiveCamera(35, 1, 5, 150000);
kamera.position.set(3400, 1800, 1700);
const steuerung = new T.OrbitControls(kamera, leinwand);
steuerung.target.set(0, 120, 0);
steuerung.enableDamping = true; steuerung.dampingFactor = 0.08;
steuerung.maxPolarAngle = 1.45; steuerung.minDistance = 60; steuerung.maxDistance = 9000;
steuerung.update();

/* ---------- Licht, Himmel, Wasser ---------- */
const sonne = new T.DirectionalLight(0xffffff, 2.5);
sonne.castShadow = true;
sonne.shadow.mapSize.set(Q.schatten, Q.schatten);
Object.assign(sonne.shadow.camera, { left: -800, right: 800, top: 800, bottom: -800, near: 100, far: 7000 });
sonne.shadow.bias = -0.0004; sonne.shadow.normalBias = 0.8;
szene.add(sonne); szene.add(sonne.target);
const himmelsLicht = new T.HemisphereLight(0xbfd8ff, 0x6a5a48, 0.6);
szene.add(himmelsLicht);
const mondLicht = new T.DirectionalLight(0x9fb4ff, 0);
mondLicht.position.set(-400, 500, 300);
szene.add(mondLicht);

const himmel = new T.Sky();
himmel.scale.setScalar(80000);
szene.add(himmel);
const himmelUmgebung = new T.Sky();
himmelUmgebung.scale.setScalar(80000);
const umgebungsSzene = new T.Scene();
umgebungsSzene.add(himmelUmgebung);
const pmrem = new T.PMREMGenerator(renderer);
let umgebungsZiel = null;

/** Wellen-Normalenbild selbst erzeugt (kachelbar), damit keine Bilddatei nötig ist. */
function wellenNormalen() {
  const N = 256, c = document.createElement("canvas"); c.width = c.height = N;
  const x = c.getContext("2d"), bild = x.createImageData(N, N), z = zufallsquelle(3);
  const wellen = [];
  for (let i = 0; i < 24; i++) wellen.push({ kx: Math.round((z() - 0.5) * 16), ky: Math.round((z() - 0.5) * 16), a: 0.4 / (1 + i * 0.25), p: z() * 6.28 });
  const h = (u, v) => wellen.reduce((s, w) => s + w.a * Math.sin(2 * Math.PI * (w.kx * u + w.ky * v) + w.p), 0);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const u = i / N, v = j / N, e = 1 / N;
    const dx = (h(u + e, v) - h(u - e, v)) * 6, dy = (h(u, v + e) - h(u, v - e)) * 6;
    const l = Math.hypot(dx, dy, 1), k = (j * N + i) * 4;
    bild.data[k] = (-dx / l * 0.5 + 0.5) * 255; bild.data[k + 1] = (-dy / l * 0.5 + 0.5) * 255; bild.data[k + 2] = (1 / l * 0.5 + 0.5) * 255; bild.data[k + 3] = 255;
  }
  x.putImageData(bild, 0, 0);
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping;
  return t;
}
const normalen = wellenNormalen();
let wasser;
if (Q.hoch) {
  wasser = new T.Water(new T.PlaneGeometry(240000, 240000), {
    textureWidth: 1024, textureHeight: 1024, waterNormals: normalen, sunDirection: new T.Vector3(0, 1, 0),
    sunColor: 0xffffff, waterColor: 0x0f5e78, distortionScale: 2.4, fog: true, alpha: 1.0
  });
  wasser.material.uniforms.size.value = 0.35;
} else {
  normalen.repeat.set(3000, 3000);
  wasser = new T.Mesh(new T.PlaneGeometry(240000, 240000), new T.MeshStandardMaterial({ color: 0x0f5e78, roughness: 0.08, metalness: 0.6, normalMap: normalen, normalScale: new T.Vector2(0.35, 0.35) }));
}
wasser.rotation.x = -Math.PI / 2;
szene.add(wasser);

/* ---------- Sterne und Mond ---------- */
const sterne = (function () {
  const z = zufallsquelle(7), pos = [];
  for (let i = 0; i < 2200; i++) {
    const w = z() * Math.PI * 2, h = 0.04 + z() * 0.96, r = 60000;
    pos.push(Math.cos(w) * Math.sqrt(1 - h * h) * r, h * r, Math.sin(w) * Math.sqrt(1 - h * h) * r);
  }
  const g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute(pos, 3));
  const p = new T.Points(g, new T.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));

let komposition = null, bloom = null, ende = null;
if (Q.hoch && T.EffectComposer && T.UnrealBloomPass) {
  const ziel = new T.WebGLRenderTarget(1, 1, { type: T.HalfFloatType, samples: 4 });
  komposition = new T.EffectComposer(renderer, ziel);
  komposition.addPass(new T.RenderPass(szene, kamera));
  bloom = new T.UnrealBloomPass(new T.Vector2(512, 512), 0.4, 0.55, 1.0);
  komposition.addPass(bloom);
  ende = new T.ShaderPass({
    uniforms: { tDiffuse: { value: null }, belichtung: { value: 0.5 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: `uniform sampler2D tDiffuse; uniform float belichtung; varying vec2 vUv;
      vec3 jarvisFit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
      vec3 jarvisAces(vec3 c){
        const mat3 ein = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
        const mat3 aus = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
        c *= belichtung / 0.6; c = ein * c; c = jarvisFit(c); c = aus * c; return clamp(c, 0.0, 1.0); }
      vec3 srgb(vec3 c){ return mix(pow(c, vec3(0.41666)) * 1.055 - vec3(0.055), c * 12.92, vec3(lessThanEqual(c, vec3(0.0031308)))); }
      void main(){ vec4 t = texture2D(tDiffuse, vUv); gl_FragColor = vec4(srgb(jarvisAces(t.rgb)), 1.0); }`
  });
  ende.material.toneMapped = false;   // eigene Tonwertkurve, Three soll keine zweite anhängen
  komposition.addPass(ende);
  renderer.toneMapping = T.NoToneMapping;  // Tonwertkurve nur einmal (im letzten Durchgang), sonst wird das Bild doppelt abgedunkelt
}
function groesse() {
  const b = leinwand.clientWidth || 800, h = leinwand.clientHeight || 600;
  renderer.setSize(b, h, false);

/* =====================================================================================
   12. BEWEGUNG
   ===================================================================================== */
const wenigBewegung = matchMedia("(prefers-reduced-motion: reduce)").matches;
const m4 = new T.Matrix4(), q4 = new T.Quaternion(), v3 = new T.Vector3(), s3 = new T.Vector3(1, 1, 1), e3 = new T.Euler();
let zeit = 0, daten = null, markiert = null;
const statusSchluessel = id => { const g = daten.gebaeude.find(x => x.id === id); return g ? g.status : "aus"; };
function bewegen(dt) {
  zeit += dt;
  if (wasser.material.uniforms) wasser.material.uniforms.time.value += dt * 0.6;
  else wasser.material.normalMap.offset.set(zeit * 0.004, zeit * 0.003);
  // Gischt pulsiert
  const col = gischt.geometry.attributes.color;
  for (let i = 0; i < col.count; i += 2) col.setW(i, 0.45 + 0.35 * Math.sin(zeit * 1.3 + i * 0.37));
  col.needsUpdate = true;
  // Autos: Rechtsverkehr im Raster und auf der Uferstraße
  autos.forEach((a, i) => {
    let x, z, fx, fz;
    const r = Math.sign(a.v);
    if (a.art === "raster") {
      a.p += a.v * dt;
      if (a.p > a.st.b) a.p = a.st.a; else if (a.p < a.st.a) a.p = a.st.b;
      if (a.st.achse === "x") { x = a.p; z = a.st.k + 5.5 * r; fx = r; fz = 0; }
      else { x = a.st.k - 5.5 * r; z = a.p; fx = 0; fz = r; }
    } else {
      const rr = inselRand(a.w) - 101 - 5 * r;
      a.w += a.v / rr * dt;
      x = Math.cos(a.w) * rr; z = Math.sin(a.w) * rr; fx = -Math.sin(a.w) * r; fz = Math.cos(a.w) * r;
    }
    e3.set(0, Math.atan2(fx, fz), 0); q4.setFromEuler(e3);
    m4.compose(v3.set(x, BODEN + 0.1, z), q4, s3.set(1, 1, 1)); autoMesh.setMatrixAt(i, m4);
    m4.compose(v3.set(x + fx * 2.3, BODEN + 0.9, z + fz * 2.3), q4, s3); scheinMesh.setMatrixAt(i, m4);
    m4.compose(v3.set(x - fx * 2.3, BODEN + 0.9, z - fz * 2.3), q4, s3); rueckMesh.setMatrixAt(i, m4);
  });
  autoMesh.instanceMatrix.needsUpdate = scheinMesh.instanceMatrix.needsUpdate = rueckMesh.instanceMatrix.needsUpdate = true;
  // Züge
  for (const z of zuege) z.wagen.forEach((w, i) => {
    const u = ((z.start + zeit * ZUG_TEMPO - i * WAGEN_ABSTAND) % 1 + 1) % 1;
    const p = bahnKurve.getPointAt(u), n = bahnKurve.getPointAt((u + 0.001) % 1);
    w.position.set(p.x, p.y + 6.4, p.z); w.lookAt(n.x, n.y + 6.4, n.z);
  });
  // Riesenrad
  radDreh.rotation.z = zeit * 0.03;
  radGondeln.forEach(g => { const w = g.userData.w + radDreh.rotation.z; g.position.set(Math.cos(w) * (rad.userData.R0 + 3), rad.userData.mitte + Math.sin(w) * (rad.userData.R0 + 3) - 4.5, 0); });
  rad.userData.ledMat.color.setHSL((zeit * 0.05) % 1, 0.9, 0.5).multiplyScalar(licht.nacht > 0.2 ? 2.5 : 0.4);
  // Boote, Luftschiffe
  for (const b of boote) {
    b.w += b.v * dt;
    b.g.position.set(Math.cos(b.w) * b.r, 0.1 + Math.sin(zeit * 1.5 + b.r) * 0.15, Math.sin(b.w) * b.r);
    b.g.rotation.y = -b.w + (b.v > 0 ? Math.PI : 0);
  }
  for (const l of luftschiffe) {
    l.w += l.v * dt * 0.5;
    l.g.position.set(Math.cos(l.w) * l.r, l.h + Math.sin(zeit * 0.3 + l.r) * 4, Math.sin(l.w) * l.r);
    l.g.rotation.y = -l.w;
  }
  // Drehende Teile der Arbeitsgebäude
  for (const id of REIHENFOLGE) agentGruppen[id].traverse(o => { if (o.userData.dreh) o.rotation.y += o.userData.dreh * dt; });
  // Antennenlichter blinken
  MAT.rotLicht.color.copy(licht.nacht > 0.2 && Math.sin(zeit * 2.4) > 0.2 ? farbe([255, 40, 30], 4) : farbe([90, 20, 20]));
  // Suchscheinwerfer schwenken
  strahlen.forEach((s, i) => { s.rotation.z = 0.32 * Math.sin(zeit * 0.31 + i * 1.7); s.rotation.x = 0.32 * Math.cos(zeit * 0.27 + i); });
  // Bildschirme
  for (const b of bildschirme) {
    if (b.art === "bunt") b.mat.color.setHSL((zeit * 0.08) % 1, 0.95, 0.55).multiplyScalar(1 + 2 * licht.nacht);
    else if (b.art === "nachrichten" && Math.floor(zeit * 10) !== b.bild) {
      b.bild = Math.floor(zeit * 10);
      const x = b.x; x.fillStyle = "#0d2a46"; x.fillRect(0, 0, 512, 256);
      x.fillStyle = "#e8f2ff"; x.font = "bold 40px system-ui, sans-serif"; x.fillText("AURON", 24, 56);
      x.fillStyle = "#7fb8ff"; x.font = "26px system-ui, sans-serif";
      const zeilen = ["Mails: 2 wichtig", "Kalender: frei", "Nachtarbeit lokal", "Speichertest ok", "Kosten 0,00 €", "Vault aktuell"];
      const ab = Math.floor(zeit / 2.5) % zeilen.length;
      for (let i = 0; i < 4; i++) x.fillText(zeilen[(ab + i) % zeilen.length], 24, 104 + i * 38);
      b.t.needsUpdate = true;
      b.mat.color.setScalar(1 + licht.nacht * 1.5);
    } else if (b.art === "kurse" && Math.floor(zeit * 8) !== b.bild) {
      b.bild = Math.floor(zeit * 8);
      const x = b.x, aus = statusSchluessel("trading") === "aus";
      x.fillStyle = "#06080c"; x.fillRect(0, 0, 512, 32);
      if (!aus) { x.font = "bold 22px monospace"; const s = "XAU +0,4%  XAG -0,2%  EURUSD +0,1%  "; x.fillStyle = "#4ce88a"; x.fillText(s + s, -((zeit * 60) % 400), 24); }
      b.t.needsUpdate = true;
    }
  }
  // Statuslichter pulsieren
  for (const id in statusMats) {
    const sk = statusSchluessel(id), st = STATUS[sk] || STATUS.aus, s = statusMats[id];
    const puls = sk === "laeuft" ? 0.75 + 0.25 * Math.sin(zeit * 3) : sk === "fehler" ? (Math.sin(zeit * 9) > 0 ? 1 : 0.15) : sk === "wartet" ? 0.6 + 0.2 * Math.sin(zeit * 1.2) : 0.25;
    s.kugel.color.copy(farbe(st.farbe, 1.5 + 2 * puls));
    s.glanz.material.color.copy(farbe(st.farbe, puls));
    s.glanz.scale.setScalar((id === "jarvis" ? 130 : 70) * (0.8 + 0.3 * puls));
  }
}

/** Schattenbereich folgt dem Blickpunkt: nah = scharf, weit weg = großer Bereich. */
let schattenHalb = 0;
function schattenNachfuehren() {
  const d = kamera.position.distanceTo(steuerung.target), h = klemme(d * 0.55, 260, 2000);
  const c = sonne.shadow.camera;
  if (Math.abs(h - schattenHalb) > schattenHalb * 0.12) { schattenHalb = h; c.left = -h; c.right = h; c.top = h; c.bottom = -h; c.updateProjectionMatrix(); }
  sonne.target.position.set(steuerung.target.x, 0, steuerung.target.z);
  sonne.position.copy(sonne.target.position).addScaledVector(sonnenRichtung, 3500);
}

const proj = new T.Vector3();
function schilderSetzen() {
  const b = leinwand.clientWidth, h = leinwand.clientHeight, rechtecke = [];
  const ids = Object.keys(schilder).sort((a, c) => (a === markiert ? -1 : c === markiert ? 1 : a === "jarvis" ? -1 : c === "jarvis" ? 1 : 0));
  for (const id of ids) {
    const g = agentGruppen[id], d = schilder[id];

    if (proj.z > 1) { d.style.display = "none"; continue; }

    d.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
    d.classList.toggle("aktiv", id === markiert);
    const breite = id === markiert ? 160 : (d.dataset.breite || (d.dataset.breite = d.querySelector(".text").textContent.length * 7 + 30));
    const r = { x: x - breite / 2, y: y - 22, w: +breite, h: 22 };
    const voll = !rechtecke.some(o => r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y);
    d.classList.toggle("klein", !voll && id !== markiert);

}
// Klick auf Gebäude
const strahl = new T.Raycaster(), maus = new T.Vector2();
let druck = null;
leinwand.addEventListener("pointerdown", e => { druck = { x: e.clientX, y: e.clientY }; });
leinwand.addEventListener("pointerup", e => {
  if (!druck || Math.hypot(e.clientX - druck.x, e.clientY - druck.y) > 6) return;
  const r = leinwand.getBoundingClientRect();
  maus.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  strahl.setFromCamera(maus, kamera);
  const treffer = strahl.intersectObjects(Object.values(agentGruppen), true).find(t => !(t.object.isSprite));
  if (treffer) { let o = treffer.object; while (o && !o.userData.id) o = o.parent; if (o) { oeffneDetail(o.userData.id); return; } }
  schliesseDetail();
});
let zeigerAufGebaeude = false;

  const r = leinwand.getBoundingClientRect();
  maus.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);

// Kamerafahrten
let fahrtToken = 0;
function fahre(pos, ziel, ms) {
  const mein = ++fahrtToken, p0 = kamera.position.clone(), z0 = steuerung.target.clone();
  if (wenigBewegung || ms <= 0) { kamera.position.copy(pos); steuerung.target.copy(ziel); return Promise.resolve(); }
  return new Promise(fertig => {
    const start = performance.now();
    (function schritt(j) {
      if (mein !== fahrtToken) { fertig(); return; }
      const t = Math.min(1, (j - start) / ms), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      kamera.position.lerpVectors(p0, pos, e); steuerung.target.lerpVectors(z0, ziel, e);
      if (t < 1) requestAnimationFrame(schritt); else fertig();
    })(start);
  });
}
const UEBERSICHT = { pos: new T.Vector3(3400, 1800, 1700), ziel: new T.Vector3(0, 120, 0) };
function uebersichtPos() {
  const a = leinwand.clientWidth / leinwand.clientHeight, f = a < 1 ? 1.9 / Math.max(a, 0.45) * 0.62 : 1;
  return { pos: UEBERSICHT.pos.clone().multiplyScalar(f), ziel: UEBERSICHT.ziel.clone() };
}
function zielFuer(id) {
  const g = agentGruppen[id], o = g.userData.oben;
  if (id === "jarvis") return { pos: new T.Vector3(1150, 720, 620), ziel: new T.Vector3(0, 320, 0) };
  const aussen = new T.Vector3(g.position.x, 0, g.position.z).normalize();
  const ziel = new T.Vector3(g.position.x, BODEN + o * 0.42, g.position.z);
  const abstand = 190 + o * 0.75;
  const pos = ziel.clone().add(aussen.multiplyScalar(abstand)).add(new T.Vector3(0, 70 + o * 0.3, 0));
  return { pos, ziel };
}
steuerung.addEventListener("start", () => { fahrtToken++; if (rundgangLaeuft) stopp(false); });

/* ---------- Detailfeld, Rundgang, Zusammenfassung ---------- */
const detail = document.getElementById("detail"), untertitel = document.getElementById("untertitel");
const knopfRundgang = document.getElementById("knopfRundgang"), knopfStopp = document.getElementById("knopfStopp");
function oeffneDetail(id) {
  const g = daten.gebaeude.find(x => x.id === id); if (!g) return;
  const st = STATUS[g.status] || STATUS.aus;
  markiert = id;
  document.getElementById("detailName").textContent = g.name;
  const s = document.getElementById("detailStatus"); s.textContent = "";
  const p = document.createElement("span"); p.className = "punkt"; p.style.background = rgbText(st.farbe);
  s.appendChild(p); s.appendChild(document.createTextNode("Status: " + st.text));
  const dl = document.getElementById("detailZahlen"); dl.textContent = "";
  (g.kennzahlen || []).slice(0, 3).forEach(z => {
    const dt = document.createElement("dt"); dt.textContent = z[0];
    const dd = document.createElement("dd"); dd.textContent = z[1];
    dl.appendChild(dt); dl.appendChild(dd);
  });
  document.getElementById("detailText").textContent = g.text || "";
  detail.classList.add("an");
}
function schliesseDetail() { detail.classList.remove("an"); if (!rundgangLaeuft) markiert = null; }
let rundgangToken = 0, rundgangLaeuft = false;
const warte = ms => new Promise(f => setTimeout(f, ms));
async function rundgang() {
  if (rundgangLaeuft) return;
  rundgangLaeuft = true;
  const mein = ++rundgangToken;
  knopfRundgang.disabled = true; knopfStopp.disabled = false;
  schliesseDetail();
  for (const id of ["jarvis"].concat(REIHENFOLGE)) {
    if (mein !== rundgangToken) return;
    const g = daten.gebaeude.find(x => x.id === id); if (!g) continue;
    markiert = id;
    untertitel.textContent = g.name + " – " + (STATUS[g.status] || STATUS.aus).text + ". " + (g.text || "");
    untertitel.classList.add("an");
    const z = zielFuer(id);
    await fahre(z.pos, z.ziel, 1300);
    if (mein !== rundgangToken) return;
    await warte(1700);
  }
  if (mein !== rundgangToken) return;
  untertitel.classList.remove("an"); markiert = null;
  const u = uebersichtPos(); await fahre(u.pos, u.ziel, 1600);
  if (mein === rundgangToken) { rundgangLaeuft = false; knopfRundgang.disabled = false; knopfStopp.disabled = true; }
}
function stopp(zurueck) {
  if (!rundgangLaeuft) return;
  rundgangToken++; rundgangLaeuft = false;
  untertitel.classList.remove("an"); markiert = null;
  knopfRundgang.disabled = false; knopfStopp.disabled = true;
  if (zurueck !== false) { const u = uebersichtPos(); fahre(u.pos, u.ziel, 900); }
}
function zusammenfassungZeigen() {

  daten.gebaeude.forEach(g => { if (zahl[g.status] !== undefined) zahl[g.status]++; });
  const z = document.getElementById("zusammenfassung"); z.textContent = "";
  Object.keys(STATUS).forEach(k => {
    const s = document.createElement("span"), p = document.createElement("span");
    p.className = "punkt"; p.style.background = rgbText(STATUS[k].farbe);
    s.appendChild(p); s.appendChild(document.createTextNode(zahl[k] + " " + STATUS[k].text)); z.appendChild(s);
  });
  const l = document.createElement("span"); l.textContent = infoLicht; z.appendChild(l);
  const h = document.createElement("span"); h.className = "hinweis"; h.textContent = daten.stand || ""; z.appendChild(h);
}
function tastaturListeBauen() {
  const liste = document.getElementById("tastaturListe"); liste.textContent = "";
  for (const id of ["jarvis"].concat(REIHENFOLGE)) {
    const g = daten.gebaeude.find(x => x.id === id); if (!g) continue;
